<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakshi ❤ Anu</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe3ec;--ink:#4a1d3a;--card:#fff8fb;--pink:#ff5c8a;--sky:#bfe6ff;--bub:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1220;--ink:#ffe3ec;--card:#3a1a2e;--sky:#5b7fa0;--bub:#ffe3ec}}
:root[data-theme="dark"]{--bg:#2a1220;--ink:#ffe3ec;--card:#3a1a2e;--sky:#5b7fa0;--bub:#ffe3ec}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;display:flex;justify-content:center;padding:16px;overflow-x:hidden}
.card{position:relative;width:100%;max-width:480px;background:var(--card);border-radius:28px;padding:16px 16px 26px;text-align:center;box-shadow:0 10px 30px rgba(255,92,138,.25);overflow:hidden;margin:auto}
.scene{position:relative}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
.bubble{position:absolute;top:6px;max-width:68%;background:var(--bub);color:#4a1d3a;border-radius:16px;padding:6px 12px;font-weight:800;font-size:.95rem;line-height:1.25;box-shadow:0 3px 10px rgba(0,0,0,.15);transition:opacity .25s,transform .25s;z-index:3}
.bubble.a{left:6px}.bubble.s{right:6px}
.bubble::after{content:"";position:absolute;bottom:-9px;width:16px;height:16px;background:inherit;transform:rotate(45deg);border-radius:3px}
.bubble.a::after{left:34%}.bubble.s::after{right:34%}
.bubble.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
h1{font-size:2rem;font-weight:800;margin:6px 0 0;line-height:1.1}
h1 span{color:var(--pink)}
.sub{font-size:1rem;margin:4px 0 0;opacity:.85}
.hint{font-size:.85rem;opacity:.7;margin:4px 0 0}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.bob2{animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-6px)}}
.mv{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.hug #anuMv{transform:translateX(34px)}.hug #sakMv{transform:translateX(-34px)}
.eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.sak .eye{animation-delay:.7s}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.heyes{display:none}
.love .heyes{display:inline}.love .neyes{display:none}
.heyes{animation:beat .5s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes beat{to{transform:scale(1.2)}}
.sweat{animation:drip 1.8s infinite;transform-box:fill-box}
@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.brow{transition:transform .25s;transform-box:fill-box;transform-origin:center}
.sus .brow{transform:translateY(-5px) rotate(-8deg)}
.tail{animation:wag .35s infinite alternate;transform-box:fill-box;transform-origin:left bottom}
@keyframes wag{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
.cloud{animation:drift 14s linear infinite alternate}
@keyframes drift{to{transform:translateX(40px)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px) rotate(-1deg)}75%{transform:translateX(5px) rotate(1deg)}}
.meter{margin:14px 6px 0;text-align:left;font-weight:800;font-size:.95rem}
.bar{height:16px;border-radius:99px;background:rgba(255,92,138,.2);overflow:hidden;margin-top:4px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#ff9aa8,#ff5c8a);border-radius:99px;transition:width .4s}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:800;background:var(--pink);color:#fff;border:0;border-radius:99px;padding:10px 20px;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.94)}
button.alt{background:#6c5ce7}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.quiz{margin-top:18px;padding:14px 10px;border-radius:20px;background:rgba(255,92,138,.1)}
.quiz p{margin:0 0 10px;font-size:1.05rem;font-weight:800}
.arena{position:relative;height:84px}
.arena button{position:absolute;top:18px}
#yes{left:calc(50% - 90px)}
#no{left:calc(50% + 10px);background:#8a7a85;transition:left .25s,top .25s}
.heart{position:absolute;bottom:-20px;font-size:20px;animation:rise 6s linear infinite;opacity:0;pointer-events:none}
@keyframes rise{10%{opacity:.9}100%{transform:translateY(-520px);opacity:0}}
.fx{position:absolute;pointer-events:none;font-size:24px;z-index:5}
@media (prefers-reduced-motion:reduce){.bob,.heart,.tail,.cloud,.sweat,.heyes,.eye{animation:none}}
</style>
</head>
<body>
<div class="card" id="card">
<div class="scene" id="scene">
<div class="bubble a pop" id="bub">Sakshi... tumhare bina WiFi bhi slow lagta hai 📶</div>
<svg id="svg" viewBox="0 0 400 300" role="img" aria-label="Funny cartoon of Anu and Sakshi holding hands, tap them">
  <rect width="400" height="300" rx="20" fill="var(--sky)"/>
  <g><circle cx="345" cy="50" r="28" fill="#ffe27a"/><rect x="326" y="42" width="17" height="10" rx="4" fill="#222"/><rect x="347" y="42" width="17" height="10" rx="4" fill="#222"/><path d="M343 46h4" stroke="#222" stroke-width="2"/><path d="M335 62q10 8 20 0" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  <g class="cloud"><ellipse cx="70" cy="70" rx="40" ry="14" fill="#fff"/><ellipse cx="100" cy="62" rx="28" ry="12" fill="#fff"/></g>
  <rect y="248" width="400" height="52" fill="#9be08a"/>
  <!-- dog photobomb -->
  <g id="dog" style="cursor:pointer"><ellipse cx="46" cy="262" rx="24" ry="14" fill="#d9a066"/><circle cx="68" cy="248" r="13" fill="#d9a066"/><ellipse cx="60" cy="243" rx="5" ry="9" fill="#a56b32"/><circle cx="72" cy="247" r="2.4" fill="#222"/><circle cx="79" cy="251" r="3" fill="#222"/><path d="M72 256q4 7 8 0z" fill="#ff7f9e"/><path class="tail" d="M24 258q-12-8-10-20" stroke="#d9a066" stroke-width="6" fill="none" stroke-linecap="round"/></g>
  <g id="bigheart"><path d="M200 112c-14-22-44-4-26 18l26 22 26-22c18-22-12-40-26-18z" fill="#ff5c8a"/></g>
  <!-- Anu -->
  <g class="mv" id="anuMv"><g class="bob" id="anu" style="cursor:pointer">
    <rect x="95" y="165" width="64" height="80" rx="22" fill="#4f8cff"/>
    <text x="127" y="212" text-anchor="middle" font-size="22">😎</text>
    <rect x="108" y="238" width="16" height="16" rx="6" fill="#33406b"/><rect x="130" y="238" width="16" height="16" rx="6" fill="#33406b"/>
    <circle cx="127" cy="130" r="42" fill="#ffd2a8"/>
    <path d="M85 126c0-34 24-48 44-48s42 14 42 46c-10-18-30-24-46-22-18 2-30 10-40 24z" fill="#2b1b17"/>
    <path d="M118 78q-4-18 6-24M130 77q2-20 12-22" stroke="#2b1b17" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M104 120q9-5 18 0M132 120q9-5 18 0" stroke="#2b1b17" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <g class="neyes"><g class="eye"><circle cx="113" cy="134" r="5.5" fill="#2b1b17"/><circle cx="115" cy="132" r="2" fill="#fff"/></g><g class="eye"><circle cx="141" cy="134" r="5.5" fill="#2b1b17"/><circle cx="143" cy="132" r="2" fill="#fff"/></g></g>
    <g class="heyes"><path d="M113 140c-10-8-12-14-7-17 4-2 7 1 7 3 0-2 3-5 7-3 5 3 3 9-7 17z" fill="#ff2d6a"/><path d="M141 140c-10-8-12-14-7-17 4-2 7 1 7 3 0-2 3-5 7-3 5 3 3 9-7 17z" fill="#ff2d6a"/></g>
    <path d="M113 150q14 16 28 0z" fill="#fff" stroke="#2b1b17" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="102" cy="148" r="6" fill="#ff9aa8" opacity=".7"/><circle cx="152" cy="148" r="6" fill="#ff9aa8" opacity=".7"/>
    <path class="sweat" d="M166 108q-6 10 0 14 6-4 0-14z" fill="#6cc3ff"/>
    <path d="M155 190q22 8 38 -2" stroke="#ffd2a8" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g></g>
  <!-- Sakshi -->
  <g class="mv" id="sakMv"><g class="bob bob2 sak" id="sak" style="cursor:pointer">
    <path d="M296 128c0 60 14 80 14 80h-62s14-20 14-80z" fill="#2b1b17"/>
    <path d="M242 245c0-34 10-60 32-60s32 26 32 60z" fill="#ff7fa8"/>
    <text x="274" y="228" text-anchor="middle" font-size="20">🍫</text>
    <rect x="258" y="238" width="14" height="16" rx="6" fill="#7a3b55"/><rect x="280" y="238" width="14" height="16" rx="6" fill="#7a3b55"/>
    <circle cx="272" cy="130" r="42" fill="#ffd2a8"/>
    <path d="M230 128c0-36 20-52 44-52s44 16 44 52c-6-20-18-30-30-32-14 12-34 14-58 32z" fill="#2b1b17"/>
    <path class="brow" d="M249 122q9-5 18 0" stroke="#2b1b17" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path class="brow" d="M277 122q9-5 18 0" stroke="#2b1b17" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <g class="eye"><circle cx="258" cy="136" r="5" fill="#2b1b17"/><circle cx="260" cy="134" r="1.8" fill="#fff"/></g>
    <g class="eye"><circle cx="286" cy="136" r="5" fill="#2b1b17"/><circle cx="288" cy="134" r="1.8" fill="#fff"/></g>
    <path id="smirk" d="M262 153q10 8 22-2" stroke="#2b1b17" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="247" cy="150" r="6" fill="#ff9aa8" opacity=".8"/><circle cx="297" cy="150" r="6" fill="#ff9aa8" opacity=".8"/>
    <circle cx="272" cy="104" r="3.5" fill="#e0234e"/>
    <path d="M247 190q-22 8 -38 -2" stroke="#ffd2a8" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g></g>
  <text x="127" y="285" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="20" fill="#2a4a1e">Anu</text>
  <text x="272" y="285" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="20" fill="#2a4a1e">Sakshi</text>
</svg>
</div>
<h1>Sakshi <span>&amp;</span> Anu</h1>
<p class="sub">Anu ka sabse bada fan: Sakshi 🥰</p>
<p class="hint">👆 Anu, Sakshi ya kutte ko tap karo!</p>

<div class="meter">Pyaar meter: <span id="pct">0</span>%<div class="bar"><div class="fill" id="fill"></div></div></div>
<div class="row">
  <button id="btn" type="button">Ek aur pyaar bhara message</button>
  <button id="hug" class="alt" type="button">Jaadu ki jhappi 🤗</button>
</div>

<div class="quiz">
  <p>Sakshi, kya tum Anu se pyaar karti ho?</p>
  <div class="arena" id="arena">
    <button id="yes" type="button">Haan ❤️</button>
    <button id="no" type="button">Sochna padega 🤔</button>
  </div>
  <div id="qres" style="font-weight:800;min-height:1.4em"></div>
</div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var card=$('card'),svg=$('svg'),bub=$('bub'),scene=$('scene');
var lines=[
['a','Sakshi... tumhare bina WiFi bhi slow lagta hai 📶'],
['s','Sirf WiFi ke liye? 🤨'],
['a','Nahi nahi! Charger, chai, sab slow! 😭'],
['s','Hmm... theek hai, maaf kiya 😏'],
['a','Tum meri sabse pyaari smile ho ❤️'],
['s','Aur tum meri sabse bade drama king 👑'],
['a','Tumhe dekh ke dil bola: "Bhai, ruk jaa!" 🛑💓'],
['s','Chalo ab chocolate nikalo 🍫'],
['a','Chocolate bhi tumhari, main bhi tumhara 🥹'],
['s','Main sirf chocolate le rahi hu 😜']
];
var li=0,tm;
function say(w,t){bub.className='bubble '+w+' pop';bub.textContent=t;void bub.offsetWidth}
function nextLine(){var l=lines[li%lines.length];li++;say(l[0],l[1]);return l}
function burst(x,y,e,n){
  var r=scene.getBoundingClientRect(),cr=card.getBoundingClientRect();
  for(var k=0;k<(n||6);k++){
    var s=document.createElement('span');s.className='fx';s.textContent=e||'💖';
    s.style.left=(x-cr.left)+'px';s.style.top=(y-cr.top)+'px';card.appendChild(s);
    var a=Math.random()*Math.PI*2,d=40+Math.random()*60;
    s.animate([{transform:'translate(0,0) scale(.5)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d-40)+'px) scale(1.3)',opacity:0}],{duration:900,easing:'ease-out'}).onfinish=(function(el){return function(){el.remove()}})(s);
  }
}
var val=0;
function bump(n){val=Math.min(100,val+n);$('pct').textContent=val;$('fill').style.width=val+'%';
  if(val>=100){say('a','Pyaar overload! Dil phat gaya 💥');var b=$('bigheart').getBoundingClientRect();burst(b.left+b.width/2,b.top,'💖',16);card.classList.add('shake');setTimeout(function(){card.classList.remove('shake');val=0;$('pct').textContent=0;$('fill').style.width='0'},1800)}}
$('btn').onclick=function(e){var l=nextLine();bump(8);burst(e.clientX,e.clientY,'💗',5)};
function lov(on){svg.classList.toggle('love',on)}
$('anu').onclick=function(e){
  lov(true);setTimeout(function(){lov(false)},2200);
  var a=['Sakshi ko dekha aur CPU hang ho gaya 🤯','Mere dil ka password: Sakshi123 🔐','Main shant hu... andar se toofaan hai 🌪️'];
  say('a',a[Math.floor(Math.random()*a.length)]);burst(e.clientX,e.clientY,'😍',5);bump(6)};
$('sak').onclick=function(e){
  svg.classList.add('sus');setTimeout(function(){svg.classList.remove('sus')},2000);
  var a=['Anu, aaj kya chahiye? 🤨','Itna pyaar? Zaroor kuch gadbad hai 🕵️','Ok ok... tum cute ho. Bas. 😳'];
  say('s',a[Math.floor(Math.random()*a.length)]);burst(e.clientX,e.clientY,'🙄',3);bump(6)};
$('dog').onclick=function(e){say('s','Tommy: "Mujhe bhi pyaar chahiye! Bhow!" 🐶');burst(e.clientX,e.clientY,'🦴',5);bump(4)};
$('hug').onclick=function(e){
  svg.classList.add('hug');lov(true);say('a','Jhappi time! Sakshi, saans le lo 😳');
  var b=$('bigheart').getBoundingClientRect();burst(b.left+b.width/2,b.top+10,'💞',10);bump(15);
  setTimeout(function(){svg.classList.remove('hug');lov(false);say('s','Bas bas, ab chhodo! 😅')},2400)};
/* runaway button */
var no=$('no'),yes=$('yes'),arena=$('arena'),dodge=0,sz=1;
var texts=['Sochna padega 🤔','Arre pakad ke dikhao 😜','Haan bolo na! 😭','Itna kaun sochta hai? 🙄','Ok ok, haan hi sahi ❤️'];
function run(){
  dodge++;no.textContent=texts[Math.min(dodge,texts.length-1)];
  var w=arena.clientWidth-no.offsetWidth,h=arena.clientHeight-no.offsetHeight;
  no.style.left=Math.max(0,Math.random()*w)+'px';no.style.top=Math.max(0,Math.random()*h)+'px';
  sz=Math.min(1.5,sz+.1);yes.style.transform='scale('+sz+')';
  if(dodge>=5){no.onclick=yes.onclick}
}
no.onmouseenter=run;no.ontouchstart=function(e){e.preventDefault();run()};no.onclick=function(e){e.preventDefault();run()};
yes.onclick=function(e){
  $('qres').textContent='Pakka? Sakshi ne haan bola! Anu ab hawa mein hai 🎈';
  lov(true);say('a','SHE SAID YES!!! 🎉💃');bump(30);
  var r=yes.getBoundingClientRect();burst(r.left+r.width/2,r.top,'🎉',12);burst(r.left+r.width/2,r.top,'❤️',10);
  no.style.display='none'};
/* ambient hearts */
for(var k=0;k<8;k++){var h=document.createElement('span');h.className='heart';h.textContent='💗';h.style.left=(8+k*12)+'%';h.style.animationDelay=(k*0.8)+'s';card.appendChild(h)}
/* auto chat */
tm=setInterval(function(){if(!document.hidden)nextLine()},5200);
</script>
</body>
</html>
